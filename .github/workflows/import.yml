name: Import saved pages

# Turns hand-saved copies of official pages (data-inbox/) into app data.
on:
  push:
    branches: [main]
    paths: ["data-inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt

      - name: Import
        id: import
        working-directory: scraper
        continue-on-error: true
        run: python import_saved.py

      - name: Commit updated data
        run: |
          git config user.name "pili-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: import saved copies ($(date -u +%F))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail if an import failed
        if: steps.import.outcome == 'failure'
        run: |
          echo "::error::One or more imports found no usable records; see the Import step log."
          exit 1
