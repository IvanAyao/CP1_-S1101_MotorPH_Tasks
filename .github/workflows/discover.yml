name: Discover page structure

# Manual helper: open URLs in the scraper's browser and print what they
# contain (JSON APIs, tables, links, text) so new parsers can be written.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to inspect"
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
      - name: Inspect
        working-directory: scraper
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: python discover.py "$URLS"
