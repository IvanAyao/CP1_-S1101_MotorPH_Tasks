name: Test scrapers

on:
  push:
    paths: ["scraper/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["scraper/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q
        working-directory: scraper
